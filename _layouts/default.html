<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/tingting-logo-v1.svg' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root{color-scheme:light;--ink:#16332c;--muted:#58736b;--mint:#f5fcf9;--mint-deep:#e8f5ef;--line:#dce9e2;--coral:#dc6a48;--yellow:#f5c24c;--white:#fff}
      *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--mint);color:var(--ink);font:16px/1.65 "Be Vietnam Pro",system-ui,-apple-system,sans-serif}a{color:inherit;text-decoration:none}a:hover{color:var(--coral)}a:focus-visible{outline:3px solid var(--yellow);outline-offset:4px;border-radius:3px}.shell{max-width:1120px;margin:auto;padding:0 36px}.topbar{height:88px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:inline-flex;align-items:center;gap:11px;font-size:22px;font-weight:800;letter-spacing:-.055em}.brand img{width:40px;height:40px;border-radius:12px}.nav{display:flex;align-items:center;gap:30px;color:var(--muted);font-size:14px;font-weight:600}.nav a:last-child{color:var(--coral)}.nav a:last-child:hover{color:var(--ink)}.intro{position:relative;display:grid;grid-template-columns:1fr 250px;align-items:center;gap:50px;min-height:390px;padding:70px 8.5%;margin:42px 0 68px;background:var(--mint-deep);border-radius:28px;overflow:hidden}.intro-copy{position:relative;z-index:1;max-width:620px}.eyebrow{margin:0 0 18px;color:var(--coral);font-size:13px;font-weight:700}.intro h1{max-width:620px;font-size:clamp(40px,6vw,66px);letter-spacing:-.065em;line-height:1.13;margin:0 0 19px}.lead{max-width:490px;margin:0;color:var(--muted);font-size:17px;line-height:1.75}.hero-mark{position:relative;display:grid;place-items:center;justify-self:center;width:190px;height:190px;border-radius:50%;background:#d7eee4}.hero-mark img{width:128px;height:128px;border-radius:30px;box-shadow:0 16px 34px #16332c20;transform:rotate(5deg)}.hero-dot{position:absolute;right:5px;top:12px;width:27px;height:27px;background:var(--yellow);border-radius:50%;border:6px solid var(--mint-deep)}.posts{padding:0 8.5% 92px}.section-heading{display:flex;align-items:end;justify-content:space-between;padding-bottom:15px;border-bottom:1px solid var(--line);margin-bottom:8px}.section-heading h2{font-size:21px;letter-spacing:-.04em;margin:0}.section-heading a,.post-meta{font-size:13px;color:var(--muted)}.post-card{padding:25px 0 27px;border-bottom:1px solid var(--line)}.post-meta{display:flex;gap:9px;margin:0 0 7px}.post-card h3{max-width:720px;font-size:25px;line-height:1.35;letter-spacing:-.04em;margin:0 0 8px}.post-card>p:not(.post-meta){max-width:720px;margin:0 0 12px;color:var(--muted)}.read-more{display:inline-flex;gap:8px;font-size:13px;font-weight:700;color:var(--coral)}.empty{display:flex;align-items:center;gap:22px;padding:33px 0}.empty-icon{flex:none;display:grid;place-items:center;width:52px;height:52px;background:#fbe9df;border-radius:16px;color:var(--coral);font-size:26px}.empty h3{font-size:17px;margin:0 0 4px}.empty p{margin:0;color:var(--muted);font-size:14px}.article{max-width:740px;margin:70px auto 100px}.article h1{font-size:clamp(38px,6vw,60px);line-height:1.15;letter-spacing:-.06em;margin:12px 0 18px}.article .post-meta{margin:24px 0 30px}.article-content{font-size:18px;line-height:1.85}.article-content h2{font-size:29px;line-height:1.3;margin:42px 0 12px;letter-spacing:-.04em}.article-content h3{font-size:22px;margin:30px 0 8px}.article-content a{text-decoration:underline;text-decoration-color:#e7aa8e;text-underline-offset:3px;color:var(--coral)}.article-content blockquote{border-left:3px solid var(--yellow);padding-left:20px;color:var(--muted);margin-left:0}.article-content img{height:auto;max-width:100%;border-radius:18px}.back{color:var(--coral);font-size:14px;font-weight:700}.footer{border-top:1px solid var(--line);padding:24px 0 34px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between}.footer-brand{display:inline-flex;align-items:center;gap:8px}.footer-brand img{width:22px;height:22px;border-radius:7px}@media(max-width:720px){.shell{padding:0 20px}.topbar{height:72px}.brand{font-size:20px}.brand img{width:35px;height:35px;border-radius:10px}.nav{gap:16px;font-size:13px}.intro{grid-template-columns:1fr;gap:25px;min-height:0;padding:38px 28px 34px;margin:25px 0 45px;border-radius:22px}.intro h1{font-size:clamp(39px,10vw,56px)}.hero-mark{grid-row:1;width:94px;height:94px;justify-self:start;margin-left:3px}.hero-mark img{width:66px;height:66px;border-radius:17px}.hero-dot{width:20px;height:20px;right:0;top:3px;border-width:4px}.posts{padding:0 4% 66px}.post-card h3{font-size:21px}.empty{align-items:flex-start;padding:26px 0}.article{margin:48px auto 70px}.article-content{font-size:17px}.footer{gap:12px;flex-direction:column}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar"><a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/tingting-logo-v1.svg' | relative_url }}" alt=""><span>tingting</span></a><nav class="nav"><a href="{{ '/' | relative_url }}">Blog</a><a href="https://tingting.coupons/">Trang chủ TingTing</a></nav></header>
      <main>{{ content }}</main>
      <footer class="footer"><span class="footer-brand"><img src="{{ '/assets/tingting-logo-v1.svg' | relative_url }}" alt="">© {{ 'now' | date: '%Y' }} TingTing</span><a href="https://tingting.coupons/tingting-privacy-policy">Chính sách quyền riêng tư</a></footer>
    </div>
  </body>
</html>
