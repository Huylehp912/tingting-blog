<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/tingting-logo-v1.svg' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --ink: #153b35;
        --ink-soft: #365b54;
        --muted: #657b75;
        --paper: #fbfcfa;
        --white: #fff;
        --mint: #d9f2e9;
        --mint-strong: #9cddc7;
        --coral: #d95738;
        --line: #dce6e1;
        --serif: "Literata", Georgia, serif;
        --sans: "Be Vietnam Pro", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.7 var(--sans); }
      a { color: inherit; text-decoration: none; }
      a:hover { color: var(--coral); }
      a:focus-visible { outline: 3px solid #dbad3f; outline-offset: 4px; border-radius: 2px; }
      .shell { width: min(1160px, 100% - 64px); margin: 0 auto; }
      .topbar { min-height: 82px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
      .brand { display: inline-flex; align-items: center; gap: 11px; font-size: 21px; font-weight: 700; letter-spacing: -.055em; }
      .brand img { width: 38px; height: 38px; }
      .brand-note { margin-left: 14px; padding-left: 14px; border-left: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: 0; }
      .nav { display: flex; gap: 28px; align-items: center; color: var(--ink-soft); font-size: 13px; font-weight: 600; }
      .nav a:last-child { color: var(--coral); }
      main { min-height: 70vh; }
      .masthead { padding: 66px 0 44px; border-bottom: 1px solid var(--line); }
      .masthead-inner { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 80px; align-items: end; }
      .masthead h1 { max-width: 730px; margin: 0; font: 600 clamp(43px, 6vw, 72px)/1.08 var(--serif); letter-spacing: -.055em; }
      .masthead h1 span { color: #39866f; }
      .masthead-copy { max-width: 320px; margin: 0 0 8px; color: var(--muted); font-size: 14px; line-height: 1.8; }
      .masthead-copy strong { display: block; margin-bottom: 8px; color: var(--ink); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
      .section-label { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; color: var(--ink-soft); font-size: 12px; font-weight: 700; }
      .section-label::before { width: 24px; height: 2px; background: var(--coral); content: ""; }
      .featured { display: grid; grid-template-columns: 1.08fr .92fr; min-height: 368px; margin: 42px 0 76px; background: #edf6f1; }
      .featured-image { min-height: 368px; overflow: hidden; }
      .featured-image img { display: block; width: 100%; height: 100%; min-height: 368px; object-fit: cover; object-position: center 38%; }
      .featured-image.poster { display: flex; align-items: center; justify-content: center; background: #e3f5ee; }
      .featured-image.poster img { width: auto; height: 368px; min-height: 0; max-width: 100%; object-fit: contain; padding: 8px; }
      .featured-copy { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 42px clamp(28px, 5vw, 64px); }
      .story-meta { display: flex; align-items: center; gap: 11px; color: var(--muted); font-size: 12px; font-weight: 500; }
      .story-topic { color: #28745f; font-weight: 700; }
      .featured h2 { margin: 19px 0 12px; font: 600 clamp(30px, 3.7vw, 44px)/1.2 var(--serif); letter-spacing: -.04em; }
      .featured-summary { margin: 0; color: var(--ink-soft); font-size: 14px; line-height: 1.8; }
      .text-link { display: inline-flex; align-items: center; gap: 10px; margin-top: 24px; color: var(--coral); font-size: 13px; font-weight: 700; }
      .text-link span { font-size: 18px; transition: transform .18s ease; }
      .text-link:hover span { transform: translateX(3px); }
      .latest { padding-bottom: 88px; }
      .latest-heading { display: flex; justify-content: space-between; align-items: end; padding-bottom: 14px; border-bottom: 1px solid var(--ink); }
      .latest-heading h2 { margin: 0; font: 600 29px/1.3 var(--serif); letter-spacing: -.035em; }
      .latest-heading a { color: var(--muted); font-size: 12px; font-weight: 600; }
      .story-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 54px; }
      .story-row { padding: 23px 0 25px; border-bottom: 1px solid var(--line); }
      .story-row h3 { margin: 9px 0 7px; font: 600 21px/1.35 var(--serif); letter-spacing: -.025em; }
      .story-row p { max-width: 490px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.75; }
      .empty { padding: 34px 0; color: var(--muted); }
      .article { max-width: 800px; margin: 44px auto 100px; }
      .back { color: var(--ink-soft); font-size: 12px; font-weight: 600; }
      .back:hover { color: var(--coral); }
      .article-header { max-width: 720px; margin: 42px auto 32px; }
      .article-header h1 { margin: 17px 0 14px; font: 600 clamp(38px, 6vw, 62px)/1.13 var(--serif); letter-spacing: -.05em; }
      .article-header .lead { max-width: 670px; margin: 0; color: var(--ink-soft); font-size: 17px; line-height: 1.8; }
      .article-cover { margin: 0 0 35px; }
      .article-cover img { display: block; width: 100%; max-height: 650px; object-fit: cover; object-position: center 38%; }
      .article-cover.poster img { width: auto; max-width: 100%; max-height: 900px; object-fit: contain; }
      .article-cover figcaption { max-width: 690px; margin: 10px auto 0; color: var(--muted); font-size: 11px; text-align: center; }
      .article-content { max-width: 680px; margin: 0 auto; color: #263f39; font-size: 16px; line-height: 1.9; }
      .article-content > p:first-child { font-size: 18px; line-height: 1.8; }
      .article-content h2 { margin: 43px 0 12px; color: var(--ink); font: 600 29px/1.3 var(--serif); letter-spacing: -.035em; }
      .article-content h3 { margin: 30px 0 8px; color: var(--ink); font: 600 21px/1.4 var(--serif); }
      .article-content p { margin: 0 0 20px; }
      .article-content ul, .article-content ol { padding-left: 25px; margin: 0 0 24px; }
      .article-content li { padding-left: 4px; margin: 0 0 9px; }
      .article-content li::marker { color: #39866f; font-weight: 700; }
      .article-content a { color: #a63e28; text-decoration: underline; text-decoration-color: #e4b3a6; text-underline-offset: 3px; }
      .article-content blockquote { margin: 28px 0; padding: 7px 0 7px 22px; border-left: 3px solid var(--mint-strong); color: var(--ink-soft); }
      .article-content figure { margin: 30px 0 34px; }
      .article-content figure.referral-poster { max-width: 540px; margin-left: auto; margin-right: auto; }
      .article-content figure img { display: block; max-width: 100%; height: auto; margin: 0 auto; }
      .article-content figcaption { margin: 9px auto 0; color: var(--muted); font-size: 12px; line-height: 1.6; text-align: center; }
      .footer { display: flex; justify-content: space-between; gap: 20px; padding: 25px 0 32px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
      .footer-brand { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-soft); font-weight: 600; }
      .footer-brand img { width: 22px; height: 22px; }
      @media (max-width: 760px) {
        .shell { width: min(100% - 40px, 600px); }
        .topbar { min-height: 70px; }
        .brand { font-size: 19px; }
        .brand img { width: 34px; height: 34px; }
        .brand-note { display: none; }
        .nav { gap: 16px; font-size: 12px; }
        .masthead { padding: 48px 0 32px; }
        .masthead-inner { grid-template-columns: 1fr; gap: 18px; }
        .masthead h1 { font-size: clamp(42px, 11vw, 58px); }
        .masthead-copy { max-width: 470px; }
        .featured { grid-template-columns: 1fr; margin: 28px 0 58px; }
        .featured-image, .featured-image img { min-height: 0; height: auto; max-height: 430px; }
        .featured-image img { aspect-ratio: 4 / 3; }
        .featured-image.poster img { height: 430px; max-height: 430px; }
        .featured-copy { padding: 28px 26px 32px; }
        .featured h2 { font-size: 33px; }
        .story-list { grid-template-columns: 1fr; }
        .latest { padding-bottom: 62px; }
        .latest-heading h2 { font-size: 26px; }
        .article { margin: 28px auto 68px; }
        .article-header { margin: 34px 0 25px; }
        .article-header h1 { font-size: clamp(37px, 10vw, 52px); }
        .article-header .lead { font-size: 15px; }
        .article-cover { margin-bottom: 27px; }
        .article-cover img { max-height: 560px; }
        .article-content { font-size: 15px; line-height: 1.85; }
        .article-content > p:first-child { font-size: 16px; }
        .article-content h2 { font-size: 25px; margin-top: 36px; }
        .footer { flex-direction: column; gap: 12px; }
      }
      @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .text-link span { transition: none; } }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/tingting-logo-v1.svg' | relative_url }}" alt=""><span>tingting</span><span class="brand-note">Góc kiến thức</span></a>
        <nav class="nav" aria-label="Điều hướng chính"><a href="{{ '/' | relative_url }}">Bài viết</a><a href="https://tingting.coupons/">TingTing</a></nav>
      </header>
      <main>{{ content }}</main>
      <footer class="footer"><span class="footer-brand"><img src="{{ '/assets/tingting-logo-v1.svg' | relative_url }}" alt="">© {{ 'now' | date: '%Y' }} TingTing</span><a href="https://tingting.coupons/tingting-privacy-policy">Chính sách quyền riêng tư</a></footer>
    </div>
  </body>
</html>
