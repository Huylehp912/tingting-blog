<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
    <style>
      :root{color-scheme:light;--ink:#17372f;--muted:#607a72;--mint:#eff9f4;--line:#deebe4;--orange:#df6b2d;--white:#fff}
      *{box-sizing:border-box}body{margin:0;background:var(--mint);color:var(--ink);font:16px/1.65 "Be Vietnam Pro",system-ui,-apple-system,sans-serif}a{color:inherit;text-decoration:none}a:hover{color:var(--orange)}.shell{max-width:960px;margin:auto;padding:0 28px}.topbar{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:22px;font-weight:800;letter-spacing:-.05em}.brand b{color:var(--orange)}.nav{display:flex;gap:26px;color:var(--muted);font-size:14px}.intro{padding:86px 0 70px;max-width:700px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--orange)}h1{font-size:clamp(42px,8vw,72px);letter-spacing:-.06em;line-height:1.08;margin:16px 0 20px}h1 span{color:var(--orange)}.lead{max-width:540px;color:var(--muted);font-size:18px}.posts{padding-bottom:90px}.section-heading{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:20px}.section-heading h2{font-size:20px;margin:0}.section-heading a,.post-meta,.read-more{font-size:13px;color:var(--muted)}.post-card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:26px 30px;margin:14px 0}.post-meta{display:flex;gap:10px;margin:0 0 8px}.post-card h3{font-size:23px;letter-spacing:-.03em;margin:0 0 8px}.post-card>p:not(.post-meta){margin:0 0 12px;color:var(--muted)}.read-more{font-weight:700;color:var(--orange)}.empty{padding:56px 20px;text-align:center;border:1px dashed #c8ddd2;border-radius:18px}.empty-icon{font-size:28px;color:var(--orange)}.empty h3{margin:10px 0}.empty p{margin:0;color:var(--muted)}.article{max-width:700px;margin:68px auto 90px}.article h1{font-size:clamp(36px,7vw,58px);margin:10px 0 16px}.article .post-meta{margin-bottom:40px}.article-content{font-size:17px}.article-content h2{font-size:28px;margin:38px 0 12px;letter-spacing:-.03em}.article-content a{text-decoration:underline;color:var(--orange)}.article-content blockquote{border-left:3px solid var(--orange);padding-left:18px;color:var(--muted);margin-left:0}.back{color:var(--orange);font-weight:700;font-size:14px}.footer{border-top:1px solid var(--line);padding:24px 0 34px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between}@media(max-width:600px){.shell{padding:0 20px}.topbar{height:70px}.nav{gap:14px;font-size:13px}.intro{padding:64px 0 52px}.post-card{padding:22px}.footer{gap:12px;flex-direction:column}}
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar"><a class="brand" href="{{ '/' | relative_url }}"><b>✳</b> tingting</a><nav class="nav"><a href="{{ '/' | relative_url }}">Blog</a><a href="https://tingting.coupons/">Trang chủ TingTing</a></nav></header>
      <main>{{ content }}</main>
      <footer class="footer"><span>© {{ 'now' | date: '%Y' }} TingTing</span><a href="https://tingting.coupons/tingting-privacy-policy">Chính sách quyền riêng tư</a></footer>
    </div>
  </body>
</html>
